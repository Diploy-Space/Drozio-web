; Local development overrides.
allow_url_fopen = On
upload_max_filesize = 200M
post_max_size = 200M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

; The checkout is bind-mounted from Windows, where Docker Desktop charges
; ~10 ms per file stat. Laravel touches ~1000 files per request, so letting
; OPcache revalidate timestamps makes every page take ~20s.
;
; The application therefore runs from a Docker volume (see docker-compose.yml),
; where a stat costs ~0.07 ms, and timestamp validation stays on so edited
; files take effect immediately after `docker/sync.ps1` copies them in.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 30000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.file_update_protection = 0

realpath_cache_size = 8192k
realpath_cache_ttl = 600
